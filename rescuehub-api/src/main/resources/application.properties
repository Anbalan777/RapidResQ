# Name of this application. Shows up in logs and, later, in monitoring tools.
spring.application.name=rescuehub-api

# Port the built-in Tomcat server listens on. Your API will be at http://localhost:8080
server.port=8080

# ---------------- Database connection ----------------

# Where the database is. Parts of the address:
#   jdbc:mysql://        use the MySQL driver
#   localhost:3306       the MySQL server on this computer, default port 3306
#   /vigileye_db         the database to use (the one you created)
#   useSSL=false         don't encrypt the connection (fine on your own laptop)
#   allowPublicKeyRetrieval=true   lets MySQL 8 log in without SSL; without it you can get a "Public Key Retrieval" error
#   serverTimezone=Asia/Kolkata    time zone used when Java and MySQL exchange dates and times
spring.datasource.url=jdbc:mysql://localhost:3306/vigileye_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

# MySQL user the app logs in as. Later you can create a dedicated user instead of root.
spring.datasource.username=root

# MySQL password. It reads the environment variable DB_PASSWORD; if that isn't set,
# it uses the text after the colon (change_me). Replace change_me with your real password for now,
# and don't commit your real password to GitHub.
spring.datasource.password=2123

# ---------------- JPA / Hibernate ----------------

# Tells Hibernate not to create, change or validate tables. Your tables come from schema.sql,
# so Hibernate must not touch them.
spring.jpa.hibernate.ddl-auto=none

# Prints every SQL statement Spring runs in the console. Useful for learning and debugging.
spring.jpa.show-sql=true

# Prints that SQL on several indented lines so it is easy to read.
spring.jpa.properties.hibernate.format_sql=true

# Stops Spring keeping a database connection open while the web response is being built.
# This avoids hidden extra queries and keeps connections free for other requests.
spring.jpa.open-in-view=false